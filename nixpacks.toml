# Nixpacks build configuration for Asked. (Laravel 13 + Inertia v3 + React 19).
#
# The Laravel provider auto-detects this app via the `artisan` file and
# wires up sensible defaults: PHP-FPM + nginx, composer, npm, the standard
# Laravel PHP extension set (mbstring, xml, pdo_*, gd, intl, bcmath, zip,
# etc.) and the cache commands. We only:
#   1. Bump Node to 22 because Vite 8 + @inertiajs/vite need Node 20+ and
#      the provider defaults to Node 18.
#   2. Inject the Laravel-specific runtime bits the provider doesn't add by
#      default (storage:link, migrate-on-boot, queue worker).
#
# We deliberately do NOT pin PHP or any extensions in `nixPkgs` — explicit
# pinning collides with the provider's auto-installed PHP package in the Nix
# store (e.g. `php-with-extensions-8.4` next to `php-with-extensions-8.3` →
# `bin/php-cgi` collision, build fails). Trust the provider; if a missing
# extension surfaces at runtime, declare it via composer.json's `require`
# (`"ext-foo": "*"`) and the provider will include it.
#
# Reference:
# - https://nixpacks.com/docs/providers/php
# - https://nixpacks.com/docs/configuration/file

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
# `composer install` first so `php artisan` is available downstream.
# `npm ci` for reproducible installs.
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
    "npm ci --no-audit --no-fund",
]

[phases.build]
# Vite must build before view:cache (so the manifest exists). storage:link
# is tolerant of an existing symlink. config/route/view/event caches are
# safe: every HTTP route uses [Controller, 'method'] form (no closures).
cmds = [
    "npm run build",
    "php artisan storage:link || true",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan event:cache",
]

[start]
# Run migrations on every boot, kick off a single queue worker in the
# background (Fortify uses queues for password-reset / 2FA / team invites),
# then hand off to php-fpm in the foreground so the provider's nginx can
# proxy to it.
cmd = "php artisan migrate --force --no-interaction && (php artisan queue:work --sleep=3 --tries=3 --timeout=60 &) && php-fpm -F"
