# Asked. — full production stack: app + Postgres + Redis
#
# Dokploy reads this file directly (Compose deployment mode). The same
# file works for local prod-parity testing:
#
#   APP_KEY=$(php artisan key:generate --show)
#   DB_PASSWORD=$(openssl rand -hex 16)
#   APP_KEY="$APP_KEY" DB_PASSWORD="$DB_PASSWORD" docker compose up --build
#   open http://localhost:8080
#
# Variables with `${VAR:-default}` syntax fall back to the local-friendly
# default when unset; in production set them via Dokploy's Environment UI
# (which overrides values declared here).

services:
  # -------------------------------------------------------------------------
  # Asked. — Laravel + Inertia + nginx + php-fpm + supervisord
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: asked
    container_name: asked-app
    restart: unless-stopped
    # Resource ceilings tuned for a 4 vCPU / 8 GB VPS. Most of the box goes
    # to the app since PHP-FPM (30 workers × ~80 MB) is the throughput knob;
    # Postgres and Redis only need ~1 GB combined for our workload.
    mem_limit: 4g
    cpus: 3.0
    # No `ports:` mapping — Dokploy's Traefik routes the domain to this
    # container via the internal Docker network on port 8080 (which the
    # Dockerfile EXPOSEs). Publishing the port to the host would clash
    # with other containers Dokploy already binds 0.0.0.0:8080 to.
    #
    # For local prod-parity testing, copy `docker-compose.override.yml.example`
    # to `docker-compose.override.yml` — that file adds the port mapping
    # without affecting production deploys (it's gitignored).
    expose:
      - "8080"
    networks:
      # `default` lets the app talk to db + redis on the internal stack network.
      # `dokploy-network` is Traefik's external network — without this, Dokploy
      # can't route the domain to the container and you get 502 Bad Gateway.
      - default
      - dokploy-network
    environment:
      # --- App ---
      APP_NAME: "Asked."
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: en

      VITE_APP_NAME: "Asked."

      # --- Logs ---
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      # --- Reverse proxy ---
      TRUSTED_PROXIES: "*"

      # --- Sessions ---
      # Cookie driver: payload lives encrypted in the client cookie, zero
      # backend round-trip per request. Removes the per-request Redis
      # GET+SET that was the public-page tail under load (200 VUs ⇒ 400
      # session ops/s competing with cache + queue traffic on the same
      # Redis instance). Trade-off: max 4KB of session data, which is
      # plenty for our token + flash + a few user prefs.
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
      SESSION_LIFETIME: 120
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SAME_SITE: lax

      # --- Database (Postgres in the `db` service) ---
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-asked}
      DB_USERNAME: ${DB_USERNAME:-asked}
      DB_PASSWORD: ${DB_PASSWORD:-asked}

      # --- Cache + queue (in Redis in the `redis` service) ---
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local

      # phpredis (C extension) is bundled in the image and is faster than
      # predis for high-frequency cache + session traffic. Override to
      # `predis` only if a deploy needs the pure-PHP fallback.
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      # Persistent connections sound great on paper but break under
      # PHP-FPM at load: workers cycle every pm.max_requests=1000, and
      # phpredis leaks/recreates persistent handles on each cycle. We
      # measured 100 VUs going from p95=58s (persistent=true) to
      # p95=229ms (persistent=false). Keep this off unless you have a
      # very good reason — the cost of a fresh socket is ~1ms.
      REDIS_PERSISTENT: ${REDIS_PERSISTENT:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-asked}

      # --- Mail (defaults to log; switch to smtp + creds in Dokploy) ---
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@asked.local}
      MAIL_FROM_NAME: "Asked."
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------------
  # Postgres — primary store
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: asked-db
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${DB_DATABASE:-asked}
      POSTGRES_USER: ${DB_USERNAME:-asked}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asked}
    volumes:
      - asked-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-asked} -d ${DB_DATABASE:-asked}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Redis — cache + sessions + queue
  # -------------------------------------------------------------------------
  # Always password-protected (defaults to `asked` for local dev — set
  # REDIS_PASSWORD in production to override). The shell wrapper around
  # redis-server lets the container read the password from its env, and
  # the healthcheck reads the same env so we don't have to hardcode it.
  redis:
    image: redis:7-alpine
    container_name: asked-redis
    restart: unless-stopped
    # Redis is single-threaded — giving it a full core matters when 1k+
    # pollers are hitting it. The 0.5 cpu cap was the bottleneck on our
    # k6 runs (Redis CPU pegged → app workers blocked on cache reads).
    mem_limit: 640m
    cpus: 1.0
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-asked}
    # `--maxmemory 512mb` leaves room under the 640m ceiling for the
    # fork-on-save overhead. `allkeys-lru` evicts least-recently-used
    # cache keys when memory is tight; sessions/queue tend to be touched
    # recently and survive.
    command:
      - sh
      - -c
      - exec redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD" --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - asked-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  asked-db:
  asked-redis:

networks:
  # The internal stack network (default) is created automatically; only the
  # external Traefik network needs declaring so Compose knows not to create
  # it. Dokploy provisions `dokploy-network` on each host. Locally, run
  # `docker network create dokploy-network` once before `docker compose up`,
  # or remove the `dokploy-network` reference from the app service.
  dokploy-network:
    external: true
