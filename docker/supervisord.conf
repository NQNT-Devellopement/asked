; Asked. — supervisord runs nginx + php-fpm + queue worker in a single container.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
loglevel = info

[program:php-fpm]
command = php-fpm -F
priority = 10
autostart = true
autorestart = true
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g 'daemon off;'
priority = 20
autostart = true
autorestart = true
stopwaitsecs = 15
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Single queue worker — Asked. uses queues for password reset, 2FA codes,
; and team invitation emails. Low-volume; one worker is enough.
[program:queue]
command = php /app/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory = /app
user = www-data
priority = 30
autostart = true
autorestart = true
stopwaitsecs = 65
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
