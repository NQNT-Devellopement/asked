; Asked. — PHP runtime settings for production
; Lives at /usr/local/etc/php/conf.d/asked.ini

memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 60
max_input_time = 60
expose_php = Off
date.timezone = UTC

; OPcache for production — preload + JIT-friendly defaults
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
opcache.save_comments = 1

; JIT — tracing mode is the most aggressive optimizer for typical web
; workloads. The buffer lives inside opcache shared memory but is sized
; independently. Disable JIT by setting jit_buffer_size = 0 if you ever
; suspect JIT-related crashes; opcache itself stays on.
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; Realpath cache helps Laravel's autoloader
realpath_cache_size = 4096K
realpath_cache_ttl = 600
