; Asked. — PHP-FPM pool overrides on top of the base www.conf shipped by the
; php:8.4-fpm-alpine image. Listens on TCP loopback so nginx can talk to it.

[www]
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
user = www-data
group = www-data

; Process manager — dynamic is right for medium traffic. Each worker uses
; ~30-50MB at runtime; 30 workers ≈ 900-1500MB. Combined with opcache (128MB),
; nginx, supervisor, and a queue worker, this fits in a 2GB container with
; headroom. Bump these if you size the container up.
pm = dynamic
pm.max_children = 30
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 1000

; Timeouts
request_terminate_timeout = 60s

; Pass logs to stdout/stderr so Docker captures them
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Clear environment per request
clear_env = no
