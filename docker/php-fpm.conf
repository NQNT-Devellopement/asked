; Asked. — PHP-FPM pool overrides on top of the base www.conf shipped by the
; php:8.4-fpm-alpine image. Listens on TCP loopback so nginx can talk to it.

[www]
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
user = www-data
group = www-data

; Process manager — dynamic is right for medium traffic. Each worker uses
; ~30-50MB at runtime; 60 workers ≈ 1.8-3 GB. Combined with opcache (128MB)
; + JIT (128MB), nginx, supervisor, and a queue worker, this fits in a 4GB
; container with headroom. Bump if you size the container up further.
pm = dynamic
pm.max_children = 60
pm.start_servers = 12
pm.min_spare_servers = 6
pm.max_spare_servers = 24
pm.max_requests = 1000

; Listen backlog: how many incoming TCP connections nginx can queue before
; FPM accepts them. Default is 511 (SOMAXCONN). Bumping to 4096 absorbs
; bursts during cache-miss stampedes without nginx returning 502.
listen.backlog = 4096

; Timeouts
request_terminate_timeout = 60s

; Pass logs to stdout/stderr so Docker captures them
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Clear environment per request
clear_env = no
