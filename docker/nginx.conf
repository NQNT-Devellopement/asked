user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/xml+rss
        font/woff2 image/svg+xml;

    # Upstream PHP-FPM pool with keepalive — reusing connections instead of
    # re-opening one per request shaves a few ms off every PHP roundtrip.
    # Pair this with `fastcgi_keep_conn on` + `fastcgi_http_version 1.1`
    # in the location block below.
    upstream php-fpm {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /app/public;
        index index.php;
        charset utf-8;

        # Static + Inertia entry: try the file, then a directory, then index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Long cache for hashed Vite assets
        location /build/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Favicon / robots fallthrough
        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt  { log_not_found off; access_log off; }

        # PHP handler — talks to PHP-FPM over the keepalive upstream pool
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 60s;

            # Required to actually reuse the upstream's keepalive pool.
            fastcgi_keep_conn on;
            fastcgi_http_version 1.1;
        }

        # Block hidden files except .well-known (used by Let's Encrypt etc.)
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
